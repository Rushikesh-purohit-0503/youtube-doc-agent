services:
  redis:
    image: redis:7-alpine
    container_name: yt-doc-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    image: ghcr.io/rushikesh-purohit-0503/yt-doc-backend:latest
    container_name: yt-doc-backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./pdfs:/app/pdfs
      - ./db:/app/db
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: ghcr.io/rushikesh-purohit-0503/yt-doc-backend:latest
    container_name: yt-doc-worker
    command: arq worker.WorkerSettings
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./pdfs:/app/pdfs
      - ./db:/app/db
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
