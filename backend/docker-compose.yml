
services:
  redis:
    image: redis:7-alpine
    container_name: yt-doc-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    container_name: yt-doc-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_FLASH_ATTENTION=1
    restart: unless-stopped

  backend:
    build: .
    container_name: yt-doc-backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - OLLAMA_HOST=http://ollama:11434
      - PDF_DIR=/app/pdfs
      - DB_PATH=/app/db/history.db
    volumes:
      - ./pdfs:/app/pdfs
      - ./db:/app/db
    depends_on:
      - redis
      - ollama
    restart: unless-stopped

  worker:
    build: .
    container_name: yt-doc-worker
    command: arq worker.WorkerSettings
    environment:
      - REDIS_URL=redis://redis:6379
      - OLLAMA_HOST=http://ollama:11434
      - PDF_DIR=/app/pdfs
      - DB_PATH=/app/db/history.db
    volumes:
      - ./pdfs:/app/pdfs
      - ./db:/app/db
    depends_on:
      - redis
      - ollama
    restart: unless-stopped

volumes:
  redis_data:
  ollama_data:
