services:
  redis:
    image: redis:7-alpine
    container_name: yt-doc-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Uncomment to run Ollama in Docker (requires NVIDIA Container Toolkit) ──
  # ollama:
  #   image: ollama/ollama
  #   container_name: yt-doc-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   environment:
  #     - OLLAMA_NUM_PARALLEL=4
  #     - OLLAMA_FLASH_ATTENTION=1
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]
  #   restart: unless-stopped

  backend:
    build: .
    container_name: yt-doc-backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - OLLAMA_HOST=http://host.docker.internal:11434
      - PDF_DIR=/app/pdfs
      - DB_PATH=/app/db/history.db
    volumes:
      - ./pdfs:/app/pdfs
      - ./db:/app/db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    container_name: yt-doc-worker
    command: arq worker.WorkerSettings
    environment:
      - REDIS_URL=redis://redis:6379
      - OLLAMA_HOST=http://host.docker.internal:11434
      - PDF_DIR=/app/pdfs
      - DB_PATH=/app/db/history.db
    volumes:
      - ./pdfs:/app/pdfs
      - ./db:/app/db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  ollama_data:
